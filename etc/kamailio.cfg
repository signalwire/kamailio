#
# Note: the comments can be:
#     - lines starting with #, but not the pre-processor directives,
#       which start with #!, like #!define, #!ifdef, #!endif, #!else, #!trydef,
#       #!subst, #!substdef, ...
#     - lines starting with //
#     - blocks enclosed in between /* */
#

# *** Value defines - IDs used later in config

# - the value for 'use_domain' parameters
#!define MULTIDOMAIN 1

# - flags
#   FLT_ - per transaction (message) flags
#    FLB_ - per branch flags
#!define FLT_ACC 1
#!define FLT_ACCMISSED 2
#!define FLT_ACCFAILED 3
#!define FLT_NATS 5

#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

####### Global Parameters #########

### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=3
log_stderror=no

memdbg=5
memlog=5
mem_join=1

log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

server_header="Server: SignalWire Proxy"
sip_warning=0

/* number of SIP routing processes */
children=48

#!ifndef KAMAILIO_DEVELOPMENT
enable_tls=yes
#!endif

tcp_children=48
/* life time of TCP connection when there is no traffic
 * - a bit higher than registration expires to cope with UA behind NAT */
tcp_connection_lifetime=630
tcp_max_connections=32000
tcp_keepalive=yes
tcp_crlf_ping=yes
tcp_keepcnt=5
tcp_keepintvl=3
tcp_connect_timeout=5
tcp_wq_max=20971520 # 10MB
tcp_conn_wq_max=524288 # 512kB
tcp_linger2=15

tls_max_connections=32000

/* latency parameters */
latency_cfg_log=3
latency_log=1
latency_limit_action=800
latency_limit_db=800

/* dns parameters */
use_dns_cache=on
dns_cache_mem=4096 # 2 MB
dns_cache_min_ttl=60 # 60 secs
dns_cache_max_ttl=300 # 5 min
dns_cache_negative_ttl=60 # time to live for negative (not found) results
dns_cache_gc_interval=60 # cleanup every 60 secs
dns_try_ipv6=no
dns_retr_time=1
dns_retr_no=1
# set next to 'no' if no need to use '/etc/resolv.conf' (faster)
dns_use_search_list=yes
use_dns_failover=on # dns based re-route on failure
dns_srv_lb=yes # srv based load balancing
dns_try_naptr=yes

/* Allow inbound HTTP requests without the Content Length header */
tcp_accept_no_cl=yes

pv_cache_action=1

/* skip reverse dns for filling alias domains */
auto_aliases=no
alias=sip.signalwire.com
alias=sip.swire.io

/* listen on local socket and advertise public address */
listen=udp:KAM_IP_LOCAL:5060 advertise KAM_IP_PUBLIC:5060
listen=tcp:KAM_IP_LOCAL:5060 advertise KAM_IP_PUBLIC:5060
listen=tls:KAM_IP_LOCAL:5061 advertise KAM_IP_PUBLIC:5061

/* Internal Swarm overlay network listens
 listen=udp:KAM_IP_OTHER:60600
listen=tcp:KAM_IP_OTHER:60600
listen=tls:KAM_IP_OTHER:60601 */

listen=tls:KAM_IP_LOCAL:443 advertise KAM_IP_PUBLIC:443

/* Internal Swarm overlay for HEP trace packets */
#!ifdef KAMAILIO_SIPTRACE_SOURCE_IP
listen=udp:KAMAILIO_SIPTRACE_SOURCE_IP:9060
#!endif

