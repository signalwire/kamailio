modparam("nathelper", "sipping_from", "sip:pinger@signalwire.com")
modparam("nathelper", "alias_name", "swrad")

# params needed for NAT traversal across modules
modparam("nathelper|registrar", "received_avp", "$avp(RECEIVED)")
modparam("usrloc", "nat_bflag", FLB_NATB)

# ----- tls params -----
