[client:default]
method = TLSv1.2+

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/ssl/private/signalwire.key
certificate = /etc/ssl/certs/signalwire.pem
verify_depth = 3
server_name = sip.eu-signalwire.com
server_name_mode = 2
server_id = sip.eu-signalwire.com
