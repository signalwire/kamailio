[server:default]
method = TLSv1+
verify_certificate = no
require_certificate = no
private_key = /run/secrets/letsencrypt.key
certificate = /run/secrets/letsencrypt.pem
verify_depth = 3
server_name = sip.signalwire.com
server_name_mode = 2
server_id = sip.signalwire.com

[server:any]
method = TLSv1+
verify_certificate = no
require_certificate = no
private_key = /usr/local/etc/kamailio/tls/sip_softphone_com.key
certificate = /usr/local/etc/kamailio/tls/sip_softphone_com.crt
verify_depth = 3
ca_list = /usr/local/etc/kamailio/tls/sip_softphone_com.ca-bundle
server_name = sip.softphone.com
server_id = sip.softphone.com

[server:any]
method = TLSv1+
verify_certificate = no
require_certificate = no
private_key = /usr/local/etc/kamailio/tls/sip.bria-x.org.key
certificate = /usr/local/etc/kamailio/tls/sip.bria-x.org.crt
verify_depth = 3
ca_list = /usr/local/etc/kamailio/tls/sip.bria-x.org.chain
server_name = sip.bria-x.org
server_id = sip.bria-x.org

[server:any]
method = TLSv1+
verify_certificate = no
require_certificate = no
private_key = /usr/local/etc/kamailio/tls/sip.mobilevoiplive.com.key
certificate = /usr/local/etc/kamailio/tls/sip.mobilevoiplive.com.crt
verify_depth = 3
ca_list = /usr/local/etc/kamailio/tls/sip.mobilevoiplive.com.chain
server_name = sip.mobilevoiplive.com
server_id = sip.mobilevoiplive.com

[server:any]
method = TLSv1+
verify_certificate = no
require_certificate = no
private_key = /usr/local/etc/kamailio/tls/sip.bria-x.net.key
certificate = /usr/local/etc/kamailio/tls/sip.bria-x.net.crt
verify_depth = 3
ca_list = /usr/local/etc/kamailio/tls/sip.bria-x.net.chain
server_name = sip.bria-x.net
server_id = sip.bria-x.net

