local:
{
	target_identity = "blade://127.0.0.1:2100";
};

signalwire_client:
{
	transport:
	{
		wss:
		{
			ssl:
			{
				key = "/etc/kamailio/ca/intermediate/private/controller@freeswitch-upstream.key.pem";
				cert = "/etc/kamailio/ca/intermediate/certs/controller@freeswitch-upstream.cert.pem";
				chain = "/etc/kamailio/ca/intermediate/certs/ca-chain.cert.pem";
			};
		};
	};
};
