bladec:
{
	blade_bootstrap = "blade://127.0.0.1:2100";
};
client:
{
	transport:
	{
        connect_timeout_ms: 10000,
		wss:
		{
			ssl:
			{
				key = "/tmp/signalwire/ca/intermediate/private/controller@freeswitch-upstream.key.pem";
				cert = "/tmp/signalwire/ca/intermediate/certs/controller@freeswitch-upstream.cert.pem";
				chain = "/tmp/signalwire/ca/intermediate/certs/ca-chain.cert.pem";
			};
		};
	};
};
